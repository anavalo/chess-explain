<!doctype html>
<meta charset="utf-8">
<style>
  :root {
    color-scheme: light dark;
    --bg: #fafaf9; --card: #fff; --text: #1c1917; --muted: #78716c; --border: #e7e5e4;
    --accent: #2563eb; --good: #15803d; --good-bg: #f0fdf4; --bad: #b91c1c; --bad-bg: #fef2f2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1917; --card: #262220; --text: #e7e5e4; --muted: #a8a29e; --border: #3a3532;
      --accent: #60a5fa; --good: #4ade80; --good-bg: #14261b; --bad: #f87171; --bad-bg: #2c1717;
    }
  }
  * { box-sizing: border-box; }
  body { font: 15px/1.6 system-ui, -apple-system, sans-serif; margin: 0; padding: 16px; background: var(--bg); color: var(--text); }
  h1 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; }
  .hint { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
  form { display: flex; gap: 8px; margin-bottom: 16px; }
  input, select { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--text); font: inherit; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { padding: 8px 16px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: 600 14px system-ui, sans-serif; cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
  .moves { display: grid; gap: 6px; }
  .move { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; border-radius: 8px; font-weight: 600; }
  .move.best { background: var(--good-bg); color: var(--good); }
  .move.compared { background: var(--bad-bg); color: var(--bad); }
  .move small { font-weight: 400; opacity: .8; margin-right: auto; margin-left: 8px; }
  .eval { font: 600 13px ui-monospace, monospace; }
  .answer p { margin: 0 0 .8em; }
  .answer p:last-child { margin-bottom: 0; }
  .answer h3 { font-size: 15px; margin: 1em 0 .4em; }
  .answer ul, .answer ol { margin: 0 0 .8em; padding-left: 1.3em; }
  .answer li { margin: .25em 0; }
  .answer strong { color: var(--text); font-weight: 650; }
  .answer a { color: var(--accent); text-decoration: none; }
  .answer a:hover { text-decoration: underline; }
  .answer code { font: 13px ui-monospace, monospace; background: var(--bg); padding: 1px 4px; border-radius: 4px; }
  details { color: var(--muted); font-size: 13px; }
  summary { cursor: pointer; user-select: none; }
  .status { display: flex; align-items: center; gap: 10px; color: var(--muted); }
  .spinner { width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  header h1 { margin: 0; }
  .icon { display: grid; place-items: center; width: 30px; height: 30px; padding: 0; background: transparent; color: var(--muted); border-radius: 8px; }
  .icon:hover, .icon[aria-expanded="true"] { background: var(--card); color: var(--text); box-shadow: inset 0 0 0 1px var(--border); }
  .settings { display: grid; gap: 18px; margin-bottom: 16px; }
  .settings[hidden] { display: none; }
  .field { display: grid; gap: 8px; }
  .field-head { display: flex; align-items: center; justify-content: space-between; }
  .label { font: 600 12px system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .pill { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--bg); color: var(--muted); }
  .pill.ok { background: var(--good-bg); color: var(--good); }
  .settings form { margin: 0; }
  .note { margin: 0; font-size: 12px; line-height: 1.45; color: var(--muted); }
  button.secondary { background: var(--bg); color: var(--text); box-shadow: inset 0 0 0 1px var(--border); }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; }
  .seg label { cursor: pointer; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg span { display: grid; gap: 1px; padding: 7px 10px; border-radius: 7px; text-align: center; color: var(--muted); }
  .seg b { font-size: 14px; font-weight: 600; }
  .seg small { font-size: 12px; }
  .seg input:checked + span { background: var(--card); color: var(--text); box-shadow: 0 0 0 1px var(--border), 0 1px 3px rgb(0 0 0 / .1); }
  .seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: -2px; }
  .error { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
</style>
<header>
  <h1>chess-explain</h1>
  <button id="gear" class="icon" type="button" title="Settings" aria-label="Settings" aria-expanded="false" aria-controls="settings">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>
    </svg>
  </button>
</header>
<p class="hint">Why lichess's top move beats the next game move, or a move you type. Turn on lichess's engine first.</p>
<section id="settings" class="card settings" hidden>
  <div class="field">
    <div class="field-head"><span class="label">Anthropic API key</span><span id="key-status" class="pill">not set</span></div>
    <form id="key-form">
      <input id="key" type="password" placeholder="sk-ant-..." autocomplete="off">
      <button class="secondary">Save</button>
    </form>
    <p class="note">Stored only in this browser profile (chrome.storage.local) and sent only to the Anthropic API. Save an empty key to delete it.</p>
  </div>
  <div class="field">
    <span class="label" id="model-label">Model</span>
    <div class="seg" role="radiogroup" aria-labelledby="model-label">
      <label><input type="radio" name="model" value="claude-haiku-5-5" checked><span><b>Haiku 5.5</b><small>Fast · under 1¢</small></span></label>
      <label><input type="radio" name="model" value="claude-opus-5-5"><span><b>Opus 5.5</b><small>Fewer mistakes · ~7¢</small></span></label>
    </div>
  </div>
</section>
<form id="form">
  <input id="move" placeholder="Compare with (default: next game move)" autocomplete="off">
  <button id="go">Explain</button>
</form>
<div id="out"></div>
<script type="module" src="panel.js"></script>
